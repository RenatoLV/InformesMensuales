<script>

/**
 * ==========================================
 * LÓGICA DE FECHAS Y LICENCIAS
 * ==========================================
 */

function calcularFechaFinUnica() {
    const motivoSelect = document.getElementById('ausenciaMotivo');
    const desdeInput = document.getElementById('ausenciaDesde');
    const diasInput = document.getElementById('ausenciaDias');
    const hastaInput = document.getElementById('ausenciaHasta');

    if (desdeInput.value && diasInput.value) {
        // Inicializar fecha forzando la hora para evitar problemas de zona horaria
        let fecha = new Date(desdeInput.value + 'T00:00:00'); 
        const dias = parseInt(diasInput.value);
        const esVacaciones = (motivoSelect.value === "8"); // Verifica si es Opción 8

        if(dias > 0) {
            if (esVacaciones) {
                // --- LÓGICA DÍAS HÁBILES (Lunes a Viernes) ---
                let diasPorSumar = dias - 1;
                
                while (diasPorSumar > 0) {
                    fecha.setDate(fecha.getDate() + 1); // Avanzar un día
                    const diaSemana = fecha.getDay();   // 0 = Domingo, 6 = Sábado
                    
                    // Si NO es sábado (6) ni domingo (0), descontamos un día hábil
                    if (diaSemana !== 0 && diaSemana !== 6) {
                        diasPorSumar--;
                    }
                }

            } else {
                // --- LÓGICA DÍAS CORRIDOS (Licencias Médicas, etc.) ---
                fecha.setDate(fecha.getDate() + (dias - 1));
            }
            
            // Formatear salida YYYY-MM-DD
            const yyyy = fecha.getFullYear();
            const mm = String(fecha.getMonth() + 1).padStart(2, '0');
            const dd = String(fecha.getDate()).padStart(2, '0');
            hastaInput.value = `${yyyy}-${mm}-${dd}`;
        } else {
            hastaInput.value = "";
        }
    } else {
        hastaInput.value = "";
    }
}

function limpiarAusenciaUnica() {
    document.getElementById('ausenciaMotivo').value = "";
    document.getElementById('ausenciaDesde').value = "";
    document.getElementById('ausenciaDias').value = "";
    document.getElementById('ausenciaHasta').value = "";
}

/**
 * ==========================================
 * MÓDULO DE NORMALIZACIÓN Y SIMILITUD
 * ==========================================
 */
function normalizarRegistro(item) {
    if (!item) return item;
    const origenRaw = (item.origen || "").toUpperCase().trim();
    if (origenRaw.includes("SUMA ALZADA")) {
        item.programa = "Honorario Suma Alzada";
    }
    if (!item.funcion || item.funcion.length < 5) {
        item.funcion = "Apoyo a la gestión municipal";
    }
    return item;
}

function toTitleCase(str) {
    return str.replace(/\w\S*/g, function(txt){
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
    });
}

function limpiarParaSimilitud(texto) {
    if (!texto) return "";
    return texto.toUpperCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") 
        .replace(/ANEXO\s*\d+/g, "") 
        .replace(/\(\d+\)/g, "")      
        .replace(/[^A-Z0-9\s]/g, "") 
        .trim();
}

function calcularSimilitud(s1, s2) {
    const c1 = limpiarParaSimilitud(s1);
    const c2 = limpiarParaSimilitud(s2);
    if (!c1 || !c2) return 0;
    if (c1 === c2) return 100;
    const filterWords = (str) => str.split(/\s+/).filter(w => w.length > 3);
    const words1 = filterWords(c1);
    const words2 = filterWords(c2);
    let matches = 0;
    words1.forEach(w => { 
        if (words2.includes(w)) matches++; 
    });
    const maxWords = Math.max(words1.length, words2.length);
    return maxWords === 0 ? 0 : Math.round((matches / maxWords) * 100);
}

function analizarLoteSimilitud() {
    if (batchList.length < 2) return { promedio: 100, baseFunc: batchList[0]?.funcion || "" };
    let mejorCandidato = "";
    batchList.forEach(i => {
        if ((i.funcion || "").length > mejorCandidato.length) mejorCandidato = i.funcion;
    });
    let totalSimilitud = 0;
    let comparaciones = 0;
    batchList.forEach((item) => {
        if (!item.encontrado) return;
        const sim = calcularSimilitud(mejorCandidato, item.funcion || "");
        item.similitud = sim; 
        totalSimilitud += sim;
        comparaciones++;
    });
    const promedio = comparaciones > 0 ? Math.round(totalSimilitud / comparaciones) : 0;
    return { promedio: promedio, baseFunc: mejorCandidato };
}

/**
 * ==========================================
 * FUNCIONES CORE DE BÚSQUEDA Y LOTE
 * ==========================================
 */

function buscar(event) {
    if(event) event.preventDefault();
    let rut = document.getElementById('rutSearch').value;
    if(!rut) return alert("Por favor, ingrese un RUT válido.");
    
    rut = formatearRutVisual(rut);
    document.getElementById('rutSearch').value = rut;

    toggleLoader(true, "Buscando funcionario...");
    
    google.script.run
      .withSuccessHandler((data) => {
          toggleLoader(false);
          if(data.encontrado) {
              data = normalizarRegistro(data);
              data.rut = formatearRutVisual(data.rut);
              
              // DETECCIÓN DE GRUPO
              if (data.esLote && data.loteDetectado.length > 0) {
                  if(confirm(`📢 SE DETECTÓ UN GRUPO MASIVO\n\nEste RUT pertenece a un grupo de ${data.loteDetectado.length} personas con la misma actividad.\n\n¿Desea cargar el modo masivo para gestionar a todos juntos?`)) {
                      batchList = data.loteDetectado.map(u => normalizarRegistro(u));
                      // Aquí llamamos a iniciarLote indirectamente o preparamos la vista
                      activarModoMasivoAutomatico(batchList); 
                      
                      localStorage.setItem('app_session_user', JSON.stringify(data));
                      renderBatchAlertList();

                      // Ocultar ausencias inmediatamente si se confirma el lote
                      const ausenciasContainer = document.getElementById('sec-ausencias');
                      if(ausenciasContainer) ausenciasContainer.classList.add('d-none');
                      
                      goToStep(2); 
                      return;
                  }
                  // Si dice que NO, sigue abajo como individual...
              }

              // LÓGICA INDIVIDUAL:
              // Aseguramos que la sección de ausencias esté visible (por si veníamos de un modo masivo cancelado)
              const ausenciasContainer = document.getElementById('sec-ausencias');
              if(ausenciasContainer) ausenciasContainer.classList.remove('d-none');

              llenarFormulario(data);              
              activarVistaLogeado(data, true); 
              
              if (data.sesionPendiente) {
                  alert("⚠️ ATENCIÓN:\n\nTiene un proceso pendiente.");
                  configurarPaso3Individual(data.links);
                  procesoBloqueado = true;
                  document.getElementById('locked-message').classList.remove('d-none');
              } else if (data.sesionFinalizada) {
                  alert("✅ Proceso finalizado.");
                  configurarPaso3Individual(data.links);
                  document.getElementById('upload-ui-single').classList.add('d-none'); 
                  document.getElementById('locked-alert-3').innerHTML = '<i class="bi bi-check-circle-fill"></i> PROCESO FINALIZADO';
                  document.getElementById('locked-alert-3').classList.replace('alert-danger', 'alert-success');
              } else {
                  goToStep(2);
              }

          } else {
              alert("RUT no encontrado.");
          }
      })
      .withFailureHandler((e) => {
          toggleLoader(false);
          alert("Error de conexión: " + e);
      })
      .buscarFuncionario(rut);
}

function verificarLote() {
    const rawText = document.getElementById('batchInputArea').value;
    const lines = rawText.split(/\r?\n|,/).map(x => x.trim()).filter(x => x !== "");
    
    if(lines.length === 0) return alert("Ingrese al menos un RUT.");
    if(lines.length > 50) return alert("Por estabilidad, procese máximo 50 RUTs a la vez.");
    
    toggleLoader(true, "Verificando y sincronizando con nube...");
    
    google.script.run
      .withSuccessHandler(res => {
          toggleLoader(false);
          
          // MAPEO INTELIGENTE BACKEND -> FRONTEND
          batchList = res.map(u => {
              // 1. Normalizar nombres y funciones
              let item = normalizarRegistro(u);
              
              // 2. Aplicar estado de la nube (si ya existía en Sheet)
              if (u.status === "GENERADO" || u.status === "FINALIZADO") {
                  item.status = u.status;
                  item.links = u.links;
                  item.uploaded = u.uploaded; // true si es FINALIZADO
              } else {
                  item.status = "SIN GENERAR"; // Default
              }
              return item;
          });

          // **PERSISTENCIA INMEDIATA**: Guardamos en LocalStorage
          // Esto protege contra F5 justo después de verificar
          guardarEstadoLote();
          
          // Renderizar tabla de vista previa
          renderBatchPreview(); 
          
          // Feedback al usuario si se recuperó trabajo
          const recuperados = batchList.filter(x => x.status === "GENERADO" || x.status === "FINALIZADO").length;
          if (recuperados > 0) {
              if(typeof Swal !== 'undefined') {
                  Swal.fire({
                      icon: 'info',
                      title: 'Progreso Recuperado',
                      text: `Se detectaron ${recuperados} funcionarios con documentos ya generados en el sistema.`,
                      timer: 3000
                  });
              } else {
                  alert(`✅ SINCRONIZACIÓN: ${recuperados} funcionarios ya tenían documentos listos.`);
              }
          }
      })
      .withFailureHandler(err => { 
          toggleLoader(false); 
          alert("Error al verificar lote: " + err); 
      })
      .validarLoteFuncionarios(lines); 
}

function renderBatchPreview() {
    const tbody = document.getElementById('batch-preview-body-check'); 
    if(!tbody) return; 
    
    tbody.innerHTML = "";
    let validCount = 0;
    
    const analisis = analizarLoteSimilitud();
    
    batchList.forEach(item => {
        let color = item.encontrado ? "text-success" : "text-danger";
        let icon = item.encontrado ? '<i class="bi bi-check-circle-fill"></i>' : '<i class="bi bi-x-circle-fill"></i>';
        
        let simBadge = "";
        if(item.encontrado) {
            let sim = item.similitud || 0;
            let bg = sim >= 95 ? "bg-success" : (sim >= 80 ? "bg-warning text-dark" : "bg-danger");
            simBadge = `<span class="badge ${bg} rounded-pill">${sim}% Igual</span>`;
        }

        let row = `<tr>
            <td class="font-monospace small align-middle">${item.rut}</td>
            <td class="${color} fw-bold align-middle">
                ${item.nombre}
                <div class="small text-muted fst-italic text-truncate" style="max-width: 350px;">
                    ${item.funcion || '<span class="text-danger fw-bold">Sin función detectada</span>'}
                </div>
            </td>
            <td class="text-center align-middle">${simBadge}</td>
            <td class="text-center align-middle">${icon}</td>
        </tr>`;
        tbody.innerHTML += row;
        if(item.encontrado) validCount++;
    });
    
    const container = document.getElementById('batch-preview-container');
    if(container) {
        container.classList.remove('d-none');
        let avisoDiv = document.getElementById('batch-similarity-alert');
        if(!avisoDiv) {
            avisoDiv = document.createElement('div');
            avisoDiv.id = 'batch-similarity-alert';
            container.insertBefore(avisoDiv, container.firstChild);
        }
        let alertClass = analisis.promedio >= 90 ? "alert-success" : "alert-warning";
        avisoDiv.className = `alert ${alertClass} small mb-2`;
        avisoDiv.innerHTML = `<strong>Análisis de Grupo:</strong> ${analisis.promedio}% de coincidencia promedio.`;
    }
    
    const btnCont = document.getElementById('btnContinuarLote');
    if(btnCont) {
        if(validCount > 0) {
            btnCont.classList.remove('d-none');
            btnCont.innerText = `CONTINUAR CON ${validCount} FUNCIONARIOS`;
        } else {
            btnCont.classList.add('d-none');
        }
    }
}

// ===============================================
// MODIFICACIÓN PRINCIPAL 1: Ocultar al iniciar
// ===============================================
function iniciarLote() {
    batchList = batchList.filter(x => x.encontrado);
    if(batchList.length === 0) return alert("No hay RUTs válidos.");

    const analisis = analizarLoteSimilitud();
    const funcionBase = analisis.baseFunc;
    let total = batchList.length;

    // Configurar UI
    document.getElementById('nombre').value = `LOTE DE ${total} FUNCIONARIOS`;
    document.getElementById('rutVisual').value = "LISTA CARGADA";
    document.getElementById('rutFull').value = "LOTE_MASIVO"; 
    
    if(funcionBase) {
        document.getElementById('funcionVisual').value = funcionBase;
    } else {
        document.getElementById('funcionVisual').value = "Apoyo a la gestión municipal";
    }

    const alertForm = document.getElementById('batch-alert-form');
    if(alertForm) {
        alertForm.classList.remove('d-none');
        document.getElementById('batch-count-display').innerText = total;
        renderBatchAlertList();
    }
    
    const warningFunc = document.getElementById('batch-function-warning');
    if(warningFunc) warningFunc.classList.remove('d-none');

    document.querySelectorAll('.single-only').forEach(el => {
        if (el.querySelector('#nacimiento')) el.style.display = 'none';
        else el.style.display = 'block'; 
    });
    
    // >>> NUEVO: OCULTAR REGISTRO DE AUSENCIAS EN MASIVO <<<
    const ausenciasContainer = document.getElementById('sec-ausencias');
    if(ausenciasContainer) ausenciasContainer.classList.add('d-none');

    activarVistaLogeado({ nombre: "Lote Masivo", rut: total + " Personas" }, false);
    goToStep(2);
}

// ===============================================
// MODIFICACIÓN PRINCIPAL 2: Mostrar al limpiar
// ===============================================
function limpiarLote() {
    const inputArea = document.getElementById('batchInputArea');
    if(inputArea) inputArea.value = "";
    const previewContainer = document.getElementById('batch-preview-container');
    if(previewContainer) previewContainer.classList.add('d-none');
    const btnCont = document.getElementById('btnContinuarLote');
    if(btnCont) btnCont.classList.add('d-none');
    batchList = [];

    // >>> NUEVO: VOLVER A MOSTRAR AUSENCIAS AL SALIR <<<
    const ausenciasContainer = document.getElementById('sec-ausencias');
    if(ausenciasContainer) ausenciasContainer.classList.remove('d-none');
}

// --- FORMULARIOS ---

function llenarFormulario(data) {
    document.getElementById('nombre').value = data.nombre || "";
    document.getElementById('programa').value = data.programa || "";
    document.getElementById('rutFull').value = data.rut || "";
    document.getElementById('rutVisual').value = data.rut || ""; 
    document.getElementById('nacimiento').value = data.nacimiento || "";
    document.getElementById('direccion').value = data.direccion || "";
    document.getElementById('funcionVisual').value = data.funcion || "";
    document.getElementById('fono').value = data.fono || "";
    document.getElementById('correo').value = data.email || "";

    if(data.jefaturaSugerida) {
        document.getElementById('inputJefaturaNombre').value = data.jefaturaSugerida;
    }
    if (data.actividadesAnteriores) {
        document.getElementById('actividades').value = data.actividadesAnteriores;
    }
}

function toggleInput(select, inputId) {
    const input = document.getElementById(inputId);
    if(select.value === 'SI') {
        input.disabled = false;
        input.focus();
    } else {
        input.disabled = true;
        input.value = ""; 
    }
}

function recopilarDatos() {
    let jefaturaNombre = document.getElementById('inputJefaturaNombre').value;
    let jefaturaDireccion = document.getElementById('inputDirJefatura').value;
    const esSubrogante = document.getElementById('chkSubrogante').checked;
    
    if (esSubrogante && !jefaturaNombre.toUpperCase().includes("(S)")) {
        jefaturaNombre += " (S)";
    }
    
    let strLicenciaDoc = "NO PRESENTA";
    let strEnfermedadDoc = "NO PRESENTA";
    let strVacacionesDoc = "NO PRESENTA";
    let backendLicenciaTexto = "NO PRESENTA"; 
    let backendPeriodosTexto = "---";           

    const selectEl = document.getElementById('ausenciaMotivo');
    const motivoVal = parseInt(selectEl.value);
    const desde = document.getElementById('ausenciaDesde').value;
    const hasta = document.getElementById('ausenciaHasta').value;
    const dias = document.getElementById('ausenciaDias').value;

    if (motivoVal && desde && hasta) {
        const textoMotivo = selectEl.options[selectEl.selectedIndex].text;
        const fmt = (iso) => {
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y}`;
        };
        const rango = `${fmt(desde)} al ${fmt(hasta)} (${dias} días)`;

        backendLicenciaTexto = textoMotivo; 
        backendPeriodosTexto = rango;

        if (motivoVal === 1) strLicenciaDoc = rango; 
        else if (motivoVal === 8) strVacacionesDoc = rango; 
        else strEnfermedadDoc = `${textoMotivo}: ${rango}`;
    }

    let rawDir = document.getElementById('direccion').value || "";
    let cleanDir = rawDir;
    if (rawDir.includes('/')) {
        const parts = rawDir.split('/');
        const validParts = parts.map(p => p.trim()).filter(p => p && p !== '-' && p !== '0');
        if (validParts.length > 0) cleanDir = validParts[validParts.length - 1];
    }

    return {
      rut: document.getElementById('rutFull').value,
      nombre: document.getElementById('nombre').value,
      programa: (document.getElementById('programa').value || "").toUpperCase(),
      funcion: document.getElementById('funcionVisual').value,
      actividades: document.getElementById('actividades').value,
      dificultades: document.getElementById('dificultades').value,
      nacimiento: document.getElementById('nacimiento').value, 
      direccion: cleanDir,          
      datoLicencia: strLicenciaDoc,
      datoEnfermedad: strEnfermedadDoc,
      datoVacaciones: strVacacionesDoc,
      licenciasTexto: backendLicenciaTexto, 
      periodosTexto: backendPeriodosTexto,
      jefaturaNombre: jefaturaNombre,
      jefaturaCargo: document.getElementById('inputCargo').value, 
      jefaturaDireccion: jefaturaDireccion, 
      mesSeleccionado: (document.getElementById('mes').value || "").toUpperCase(),
      fechaInicioMes: document.getElementById('periodoMes').value,
      fechaFinMes: document.getElementById('periodoFinMes').value,
      fono: document.getElementById('fono').value,
      correo: document.getElementById('correo').value
    };
}

function initJefaturas() {
   const dataList = document.getElementById('listJefaturas');
   if(!dataList) return;
   dataList.innerHTML = "";
   let optLoading = document.createElement('option');
   optLoading.value = "Cargando jefaturas...";
   dataList.appendChild(optLoading);

   google.script.run
      .withSuccessHandler(function(nombres) {
         dataList.innerHTML = ""; 
         nombres.forEach(nombre => {
            let opt = document.createElement('option');
            opt.value = nombre;
            dataList.appendChild(opt);
         });
      })
      .withFailureHandler(function(e) { console.error(e); })
      .obtenerListaNombresJefaturas();
}

function autocompletarJefatura(nombreSeleccionado) {
  if (!nombreSeleccionado) return;
  
  // Feedback visual de carga
  const inputDir = document.getElementById('inputDirJefatura');
  const inputCargo = document.getElementById('inputCargo');
  inputDir.style.opacity = "0.5";
  document.body.style.cursor = 'wait';

  google.script.run
      .withSuccessHandler(function(datos) {
          document.body.style.cursor = 'default';
          inputDir.style.opacity = "1";

          if (datos) {
              // 1. Asignar Cargo
              // Intentamos calzar el valor exacto del select, si no, lo dejamos vacío para que el usuario elija
              if (datos.cargo.includes("DIRECTOR")) inputCargo.value = "DIRECTOR(A)";
              else if (datos.cargo.includes("DEPARTAMENTO")) inputCargo.value = "JEFE(A) DE DEPARTAMENTO";
              else if (datos.cargo.includes("OFICINA")) inputCargo.value = "ENCARGADO(A) DE OFICINA";
              else if (datos.cargo.includes("ALCALDE")) inputCargo.value = "ALCALDE";
              else if (datos.cargo.includes("ADMINISTRADOR")) inputCargo.value = "ADMINISTRADOR(A) MUNICIPAL";
              else inputCargo.value = ""; // Si no calza, dejar que usuario elija

              // 2. Asignar Dirección Completa (ESTO ES LO IMPORTANTE)
              // Aquí llegará algo como: "DIRECCION DE TRANSITO / DEPARTAMENTO DE INGENIERIA"
              document.getElementById('inputDirJefatura').value = datos.unidad || "";

              // 3. Check Subrogancia
              document.getElementById('chkSubrogante').checked = datos.esSub;
          }
      })
      .withFailureHandler(function(e) { 
          console.error(e);
          document.body.style.cursor = 'default';
          inputDir.style.opacity = "1";
      })
      .buscarInfoJefaturaPorNombre(nombreSeleccionado);
}
</script>
