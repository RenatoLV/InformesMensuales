<script>
/**
 * ==========================================
 * MÓDULO CORE
 * Variables Globales y Utilidades Genéricas
 * ==========================================
 */

// --- Variables de Estado Global ---
let currentStep = 1;
let procesoBloqueado = false; 
let isBatchMode = false;      
let batchList = [];            

// --- Utilidades Visuales ---


function toggleLoader(show, text="Cargando...") {
    const el = document.getElementById('loader');
    if(show) {
       document.getElementById('loader-text').innerText = text;
       el.classList.remove('d-none');
    } else {
       el.classList.add('d-none');
    }
}
// --- Manejo de Fechas ---

function initDate() {
    const meses = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
    const sel = document.getElementById('mes');
    if(!sel) return;
    
    sel.innerHTML = ""; 
    meses.forEach(m => { let o = document.createElement('option'); o.text=m; o.value=m; sel.add(o); });
    
    // Seleccionar mes actual
    try { 
        sel.value = meses[new Date().getMonth()]; 
        // BLOQUEAR MES POR DEFECTO PARA EVITAR ERRORES
        sel.disabled = true; 
    } catch(e){}
    
    // Calcular fechas de inicio y fin inmediatamente
    actualizarFechasPorMes();
}

function actualizarFechasPorMes() {
    const mesNombre = document.getElementById('mes').value;
    const anioActual = new Date().getFullYear();
    let anio = anioActual;
    
    // Ajuste si estamos en Enero y seleccionamos Diciembre (asume año anterior)
    if (mesNombre === "Diciembre" && new Date().getMonth() === 0) {
        anio = anio - 1;
    }

    const meses = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
    const mesIndex = meses.indexOf(mesNombre);
    
    if (mesIndex > -1) {
        const primerDia = new Date(anio, mesIndex, 1);
        const ultimoDia = new Date(anio, mesIndex + 1, 0); // Día 0 del siguiente mes es el último del actual
        
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        // Asignar a los inputs
        document.getElementById('periodoMes').value = primerDia.toLocaleDateString('es-CL', options);
        document.getElementById('periodoFinMes').value = ultimoDia.toLocaleDateString('es-CL', options);
        
        // REINICIAR ESTADO DE CANDADOS SI CAMBIA EL MES (volver a bloquear)
        // Esto es opcional, pero buena práctica si el mes cambiara.
        // Como el mes está bloqueado, esto solo aplica en la carga inicial.
        lockDateInput('periodoMes');
        lockDateInput('periodoFinMes');
    }
}
function formatearRutVisual(rut) {
    if(!rut) return "";
    let r = rut.trim();
    // Si empieza con 9.xxx o similar (menos de 12 chars) y es numérico
    // Ejemplo: 9.347.229-4 (11 chars) -> Agrega el 0 al inicio
    if (/^[1-9]\./.test(r) && r.length < 12) {
        return "0" + r;
    }
    return r;
}
function bloquearMesesCompletados(mesesBloqueados) {
    const sel = document.getElementById('mes');
    const options = sel.options;
    
    // Restaurar primero (aunque ahora por defecto está disabled, mantenemos lógica visual)
    for (let i = 0; i < options.length; i++) {
        options[i].innerText = options[i].value.replace("✅ ", "").replace(" (Entregado)", ""); 
    }
    
    if (!mesesBloqueados || mesesBloqueados.length === 0) return;

    for (let i = 0; i < options.length; i++) {
        if (mesesBloqueados.includes(options[i].value)) {
            // Marca visual aunque esté deshabilitado el select general
            options[i].innerText = "✅ " + options[i].value + " (Entregado)";
        }
    }
}

// --- NUEVA FUNCIÓN: CONTROL DEL CANDADO ---
function toggleDateLock(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    
    if (input.readOnly) {
        // DESBLOQUEAR
        input.readOnly = false;
        input.classList.remove('form-control-plaintext');
        input.classList.add('form-control', 'bg-white', 'border-warning');
        icon.classList.replace('bi-lock-fill', 'bi-unlock-fill');
        btn.classList.replace('text-secondary', 'text-warning');
        input.focus();
    } else {
        // BLOQUEAR
        lockDateInput(inputId);
    }
}

function lockDateInput(inputId) {
    const input = document.getElementById(inputId);
    // Buscar el botón asociado (hermano en el DOM)
    const btn = input.nextElementSibling; 
    if(!btn) return;
    const icon = btn.querySelector('i');

    input.readOnly = true;
    input.classList.add('form-control-plaintext');
    input.classList.remove('form-control', 'bg-white', 'border-warning');
    
    if(icon) {
        icon.classList.replace('bi-unlock-fill', 'bi-lock-fill');
        btn.classList.replace('text-warning', 'text-secondary');
    }
}
</script>
