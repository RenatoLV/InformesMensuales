<style>
/* =========================================
   1. FUENTES Y VARIABLES
   ========================================= */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');

:root {
  --primary-color: #003366; /* Azul Corporativo */
  --secondary-color: #eab308; /* Amarillo Corporativo */
  --bg-app: #f8fafc; /* Fondo gris muy suave */
  --text-main: #334155;
  --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
  --card-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

body {
  font-family: 'Outfit', sans-serif;
  background-color: var(--bg-app);
  color: var(--text-main);
  overflow-x: hidden;
}

.transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

/* =========================================
   2. HEADER (MÁS GRANDE Y LIMPIO)
   ========================================= */
.header-main {
  background: var(--primary-color) !important;
  box-shadow: 0 4px 20px rgba(0, 51, 102, 0.2);
  border-bottom: 5px solid var(--secondary-color);
  padding: 1.2rem 0; /* Aumentado para mayor altura */
}

/* =========================================
   3. PANTALLA INICIO (HOME)
   ========================================= */

/* Buscador estilo pastilla (Pill) */
.search-pill-card {
  border-radius: 50px;
  background: white;
  padding: 8px;
  box-shadow: var(--card-shadow);
  border: 1px solid #e2e8f0;
}

.search-input-group .form-control {
  border: none;
  box-shadow: none;
  font-size: 1.2rem;
  padding-left: 20px;
  background: transparent;
  color: #1e293b;
}

.search-input-group .input-group-text {
  background: transparent;
  border: none;
  padding-left: 25px;
}

.btn-ingresar {
  background-color: #0d6efd;
  border: none;
  border-radius: 50px !important;
  padding: 12px 40px;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: transform 0.2s, background-color 0.2s;
}
.btn-ingresar:hover {
  background-color: #0b5ed7;
  transform: translateY(-1px);
}

/* --- TARJETAS DE PASOS (ANIMACIONES NUEVAS) --- */
.step-card-home {
  background: #ffffff;
  border-radius: 24px;
  padding: 2.5rem 1.5rem;
  border: 1px solid #f1f5f9;
  height: 100%;
  box-shadow: var(--card-shadow);
  /* Nueva animación suave y elástica */
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  
  /* Flexbox para centrar y evitar deformación */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* Alineación superior */
  text-align: center;
  cursor: default;
}

.step-card-home:hover {
  transform: translateY(-10px) scale(1.02); /* Sube y crece un poco */
  box-shadow: 0 25px 50px -12px rgba(0, 51, 102, 0.15); /* Sombra azulada */
  border-color: #bae6fd; /* Borde azul claro */
}

/* Iconos de pasos grandes y fijos */
.step-icon-img {
  width: 96px;  /* Tamaño fijo grande */
  height: 96px; /* Cuadrado perfecto */
  object-fit: contain;
  margin-bottom: 1.5rem;
  flex-shrink: 0; /* CRUCIAL: Evita que se aplaste */
  transition: transform 0.4s ease;
}

.step-card-home:hover .step-icon-img {
    transform: scale(1.1) rotate(5deg); /* Efecto pop en el icono */
}

/* Número del paso */
.step-number {
  background: #f0f9ff;
  color: #0284c7;
  width: 48px;
  height: 48px;
  min-width: 48px;
  min-height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.2rem;
  margin-bottom: 1rem;
  transition: all 0.3s ease;
}

.step-card-home:hover .step-number {
    background-color: var(--primary-color);
    color: white;
    transform: scale(1.1);
}

/* =========================================
   4. SIDEBAR (PERFIL)
   ========================================= */

.sidebar-card {
  border: none;
  border-radius: 20px;
  background: white;
  box-shadow: var(--card-shadow);
  overflow: hidden;
}

.profile-header {
  padding: 2.5rem 1.5rem 1.5rem;
  text-align: center;
  background: white;
  position: relative;
}

/* Fondo decorativo superior (AHORA AZUL OSCURO) */
.profile-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100px; /* Altura del fondo azul */
  /* Nuevo color azul oscuro con gradiente suave */
  background: linear-gradient(135deg, var(--primary-color) 0%, #002244 100%);
  z-index: 0;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid white; /* Borde blanco para resaltar sobre el azul */
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  margin-bottom: 0.5rem;
  position: relative;
  z-index: 1;
  background: white;
}

/* Stepper Vertical */
.vertical-stepper {
  position: relative;
  padding-left: 10px;
  margin-top: 10px;
}

.vertical-stepper::before {
  content: '';
  position: absolute;
  left: 32px;
  top: 20px;
  bottom: 20px;
  width: 2px;
  background-color: #e2e8f0;
  z-index: 0;
}

.step-item-sidebar {
  display: flex;
  align-items: center;
  margin-bottom: 1.2rem;
  position: relative;
  z-index: 1;
  color: #94a3b8;
  transition: all 0.3s;
  padding: 5px;
  border-radius: 12px;
}

.step-item-sidebar:hover {
    background-color: #f8fafc;
}

.step-item-sidebar.active { color: var(--primary-color); opacity: 1; }
.step-item-sidebar.completed { color: #10b981; opacity: 1; }

.step-icon-box {
  width: 45px;
  height: 45px;
  min-width: 45px;
  min-height: 45px;
  background: white;
  border: 2px solid #e2e8f0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 15px;
  font-size: 1.1rem;
  transition: all 0.3s;
  flex-shrink: 0; /* Evita deformación */
}

.step-item-sidebar.active .step-icon-box {
  border-color: var(--primary-color);
  background-color: var(--primary-color);
  color: white;
  box-shadow: 0 0 0 4px rgba(0, 51, 102, 0.1);
}

.step-item-sidebar.completed .step-icon-box {
  border-color: #10b981;
  background-color: #10b981;
  color: white;
}

/* =========================================
   5. FORMULARIO
   ========================================= */

.form-control, .form-select {
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
}

.form-control[readonly], .form-control:disabled, .form-select:disabled {
  background-color: #f1f5f9;
  border-color: #e2e8f0;
  color: #475569;
  font-weight: 500;
  opacity: 1;
}

.section-title {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #64748b;
  text-transform: uppercase;
  margin-bottom: 1.2rem;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 8px;
  margin-top: 1.5rem;
}

/* Animaciones */
.fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.hover-scale:hover { transform: scale(1.02); }
.group:hover .group-hover\:opacity-100 { opacity: 1; }

/* Loaders y Utilidades */
.loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 51, 102, 0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
.upload-area { cursor: pointer; transition: 0.3s; border: 2px dashed #cbd5e1; background-color: #f8fafc; }
.upload-area:hover { background-color: #eff6ff; border-color: var(--primary-color); }

/* =========================================
   6. WIZARD INTERNO DEL FORMULARIO
   ========================================= */
.wizard-header { position: relative; margin-bottom: 2.5rem; }
.wizard-progress-container { position: relative; width: 100%; }
.wizard-progress-container .progress {
    position: absolute;
    top: 20px; /* ALINEACIÓN HORIZONTAL PERFECTA CON EL CENTRO DEL CÍRCULO (40px / 2) */
    left: 12.5%; /* EMPIEZA EXACTAMENTE EN EL CENTRO DEL PRIMER PASO (25% / 2) */
    right: 12.5%; /* TERMINA EXACTAMENTE EN EL CENTRO DEL ÚLTIMO PASO */
    height: 4px !important;
    background-color: #e2e8f0;
    transform: translateY(-50%);
    z-index: 1;
    border-radius: 2px;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.wizard-progress-bar {
    height: 100%;
    background-color: var(--primary-color);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.wizard-step-indicator {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: transparent;
    width: 25%; /* CADA PASO TOMA EL 25% DEL ANCHO */
    flex-shrink: 0;
}
.wizard-step-indicator .step-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: white; /* FONDO BLANCO SÓLIDO PARA TAPAR LA LÍNEA DETRÁS */
    border: 3px solid #e2e8f0;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.1rem;
    transition: all 0.3s ease;
}
.wizard-step-indicator.active .step-circle {
    border-color: var(--primary-color);
    background-color: var(--primary-color);
    color: white;
    box-shadow: 0 0 0 5px rgba(0, 51, 102, 0.15);
}
.wizard-step-indicator.completed .step-circle {
    border-color: #10b981;
    background-color: #10b981;
    color: white;
}
.wizard-step-indicator .step-text {
    margin-top: 10px;
    font-size: 0.75rem;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: center;
    white-space: nowrap;
}
.wizard-step-indicator.active .step-text { color: var(--primary-color); }
.wizard-step-indicator.completed .step-text { color: #10b981; }

.form-wizard-step { display: none; animation: fadeIn 0.4s ease-in-out forwards; }
.form-wizard-step.active { display: block; }

/* Textareas auto-expandibles */
textarea.auto-expand {
    resize: none;
    overflow-y: hidden;
    min-height: 100px;
    transition: height 0.15s ease-out;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
