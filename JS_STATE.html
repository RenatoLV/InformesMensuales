<script>
/**
 * ==========================================
 * MÓDULO STATE & ACTIONS (CONTROLADOR PRINCIPAL)
 * ==========================================
 */

// --- FUNCIÓN DE INICIO ---
function initAppState() {
    const savedUser = localStorage.getItem('app_session_user');
    const isLocked = localStorage.getItem('app_session_locked');
    const savedBatchList = localStorage.getItem('app_session_batch_list');

    if (savedUser) {
        try {
            const userData = JSON.parse(savedUser);
            
            // --- 1. RECUPERACIÓN DE MODO MASIVO (PRIORIDAD ALTA) ---
            // Si existe una lista guardada y el usuario estaba trabajando en lote
            if (savedBatchList && (userData.esLote || userData.nombre === "Lote Masivo")) {
                console.log("🔄 Recuperando sesión de Lote Masivo...");
                
                isBatchMode = true;
                batchList = JSON.parse(savedBatchList);

                // [MEJORA CRÍTICA] SANITIZACIÓN DE ESTADOS "ZOMBIE"
                // Si se recargó la página mientras algo estaba "PROCESANDO", ese proceso murió.
                // Debemos limpiar ese estado para que no quede pegado visualmente.
                let fixedList = false;
                batchList = batchList.map(b => {
                    if (b.status === "PROCESANDO" || b.status === "EN COLA") {
                        fixedList = true;
                        // Lo marcamos como ERROR para que el usuario vea que ese item falló/se interrumpió
                        // y pueda tomar acción (borrar/reintentar).
                        return { ...b, status: "ERROR", errorDetail: "Interrumpido por recarga" }; 
                    }
                    return b;
                });
                
                if(fixedList) {
                    localStorage.setItem('app_session_batch_list', JSON.stringify(batchList));
                }
                
                // Restaurar UI Visual (Sidebar, Títulos, Botones)
                activarVistaLogeado(userData, false); 
                activarModoMasivoAutomatico(batchList);

                // LÓGICA CLAVE: SOFTLOCK Y RECUPERACIÓN
                // Verificamos si la lista YA tiene items generados o finalizados.
                const hayGenerados = batchList.some(u => u.status === "GENERADO" || u.status === "FINALIZADO");
                
                // Si hay items listos O si el candado de seguridad estaba puesto
                if (hayGenerados || isLocked === 'true') {
                    console.log("📂 Detectados archivos generados o bloqueo activo. Forzando Paso 3.");
                    
                    // Esperamos un momento para que el DOM termine de pintar
                    setTimeout(() => {
                        // Renderizar la tabla de carga con los datos recuperados
                        if (typeof configurarPaso3Lote === 'function') {
                            configurarPaso3Lote(); 
                        }
                        
                        // Asegurar que la alerta de bloqueo sea visible
                        const alert3 = document.getElementById('locked-alert-3');
                        if(alert3) alert3.classList.remove('d-none');
                        
                        // Ir al paso 3 explícitamente
                        goToStep(3);
                    }, 200);
                } else {
                    // Si no hay nada generado y no está bloqueado, es seguro volver al Paso 2
                    console.log("📝 No hay archivos generados. Volviendo a revisión de lista.");
                    if (typeof renderBatchAlertList === 'function') {
                        renderBatchAlertList(); 
                    }
                    goToStep(2);
                }

            } else {
                // --- 2. RECUPERACIÓN MODO INDIVIDUAL ---
                activarVistaLogeado(userData, false); 
                llenarFormulario(userData); 
                
                // Lógica de bloqueo individual
                if (isLocked === 'true') {
                    procesoBloqueado = true;
                    safeClassRemove('locked-message', 'd-none');
                    const savedLinks = localStorage.getItem('app_session_links');
                    
                    if (savedLinks) {
                        const links = JSON.parse(savedLinks);
                        if (typeof configurarPaso3Individual === 'function') {
                            configurarPaso3Individual(links);
                        }
                        setTimeout(() => {
                            goToStep(3);
                            console.log("Sesión individual restaurada en Paso 3");
                        }, 200);
                    } else {
                        // Caso raro: Bloqueado pero sin links (posible error previo). Liberar.
                        goToStep(2);
                    }
                } else {
                    goToStep(2);
                }
            }
        } catch(e) {
            console.error("Error crítico al restaurar sesión:", e);
            // Si hay corrupción, limpiamos para evitar bucles
            limpiarStorageCompleto();
            location.reload();
        }
    }
}

// --- NAVEGACIÓN ENTRE PASOS ---
function goToStep(step) {
    // GUARDIA: Impedir volver atrás si ya hay documentos generados (Bloqueo lógico)
    // Verificamos tanto la bandera de bloqueo como el estado real de la lista masiva
    const isLocked = localStorage.getItem('app_session_locked') === 'true';
    const hayGeneradosEnLote = isBatchMode && batchList.some(u => u.status === "GENERADO");
    
    // Solo bloqueamos retroceder si vamos a pasos anteriores al 3 (1 o 2)
    if ((isLocked || hayGeneradosEnLote) && step < 3) {
        if(typeof Swal !== 'undefined') {
            Swal.fire({
                icon: 'warning',
                title: 'Proceso en Curso',
                text: 'Ya se generaron documentos. Para evitar duplicidad o errores, debe finalizar la carga de los archivos actuales.',
                confirmButtonText: 'Entendido'
            });
        } else {
            alert("⚠️ ACCIÓN BLOQUEADA\n\nYa generó los documentos. Debe subir los archivos firmados para finalizar.");
        }
        // Rebotar al paso 3
        goToStep(3);
        return; 
    }
   
    // Validación básica Paso 1 -> 2 (Identificación requerida)
    if (step > 1 && !isBatchMode && document.getElementById('rutFull') && document.getElementById('rutFull').value === "") {
        if (!batchList.length > 0 && !localStorage.getItem('app_session_user')) {
             return alert("Por favor, identifíquese primero en el Paso 1.");
        }
    }

    // Ocultar todos, mostrar actual
    document.querySelectorAll('.step-content').forEach(el => {
        el.classList.remove('active'); 
        el.classList.add('d-none');    
    });
   
    const targetEl = document.getElementById(`step-${step}-content`);
    if (targetEl) {
        targetEl.classList.remove('d-none'); 
        setTimeout(() => targetEl.classList.add('active'), 10); 
    }
   
    updateSidebarStepper(step);
    currentStep = step;
    window.scrollTo(0,0);
}

function updateSidebarStepper(step) {
    document.querySelectorAll('.step-item-sidebar').forEach(el => {
        el.classList.remove('active');
        el.classList.remove('completed');
    });

    if(step === 1) safeClassAdd('step-ind-1', 'active');
    if(step === 2) {
        safeClassAdd('step-ind-1', 'completed');
        safeClassAdd('step-ind-2', 'active');
    }
    if(step === 3) {
        safeClassAdd('step-ind-1', 'completed');
        safeClassAdd('step-ind-2', 'completed');
        safeClassAdd('step-ind-3', 'active');
    }
}
// --- UI HELPERS ---
function safeSetText(id, text) {
    const el = document.getElementById(id);
    if (el) el.innerText = text;
}

function safeClassRemove(id, className) {
    const el = document.getElementById(id);
    if (el) el.classList.remove(className);
}

function safeClassAdd(id, className) {
    const el = document.getElementById(id);
    if (el) el.classList.add(className);
}

// --- VISTA LOGUEADO ---
function activarVistaLogeado(data, saveToStorage = true) {
    const sidebar = document.getElementById('layout-sidebar');
    const main = document.getElementById('layout-main');
    const btnSalir = document.getElementById('btnSalir');

    if(sidebar) sidebar.classList.remove('d-none');
    
    if(main) {
        main.classList.remove('col-12');    
        main.classList.add('col-lg-9');
    }
    
    if(btnSalir) btnSalir.classList.remove('d-none');

    // Manejo robusto del nombre a mostrar
    let displayNombre = "Usuario";
    if (data.nombre) {
        if(data.nombre === "Lote Masivo") {
            displayNombre = "Lote Masivo";
        } else {
            // Intentar mostrar Primer Nombre + Primer Apellido
            let partes = data.nombre.split(" ");
            displayNombre = partes[0] + " " + (partes[2] || "");
        }
    }
    
    safeSetText('sidebarNombre', displayNombre);
    safeSetText('sidebarRut', data.rut || "");
    safeSetText('sidebarPrograma', data.origen || (data.programa || "HONORARIOS"));
    
    const elDireccion = document.getElementById('sidebarDireccion');
    if(elDireccion) {
        elDireccion.innerText = data.direccion || "Sin Unidad Asignada";
        elDireccion.title = data.direccion || ""; 
    }

    // Solo guardar usuario base si se pide explícitamente (para evitar sobrescribir con datos parciales)
    if(saveToStorage) { 
        localStorage.setItem('app_session_user', JSON.stringify(data));
    }
}


function toggleMode(e) {
    if(e) e.preventDefault();
    isBatchMode = !isBatchMode;
    
    const link = document.getElementById('toggleModeLink');
    const divSingle = document.getElementById('mode-single');
    const divBatch = document.getElementById('mode-batch');
    const badge = document.getElementById('badgeMode');

    if(isBatchMode) {
        if(link) link.innerHTML = '<i class="bi bi-person-fill"></i> Volver a ingreso individual';
        if(divSingle) divSingle.classList.add('d-none');
        if(divBatch) divBatch.classList.remove('d-none');
        if(badge) {
            badge.innerText = "Modo Masivo";
            badge.classList.replace('bg-success-subtle', 'bg-warning-subtle');
            badge.classList.replace('text-success', 'text-warning');
        }
    } else {
        if(link) link.innerHTML = '<i class="bi bi-grid-3x3-gap-fill"></i> Agregar varios RUN';
        if(divSingle) divSingle.classList.remove('d-none');
        if(divBatch) divBatch.classList.add('d-none');
        if(badge) {
            badge.innerText = "Individual";
            badge.classList.replace('bg-warning-subtle', 'bg-success-subtle');
            badge.classList.replace('text-warning', 'text-success');
        }
    }
}

function intentarSalir() {
    let msg = "¿Desea cerrar la sesión?";
    
    if (isBatchMode) {
        const pending = batchList.filter(x => x.status === "GENERADO" && !x.uploaded);
        if (pending.length > 0) {
            msg = "⚠️ AÚN TIENE FUNCIONARIOS PENDIENTES DE SUBIDA.\n\nSi sale ahora, perderá el progreso de los archivos ya generados y tendrá que generarlos nuevamente.\n\n¿Está seguro de salir?";
        }
    } else if(localStorage.getItem('app_session_locked') === 'true') {
        msg = "⚠️ ADVERTENCIA: Documento generado pero no subido.\n\nSi sale ahora, deberá generar el documento nuevamente.";
    }
    
    if(!confirm(msg)) return;
    
    limpiarStorageCompleto();
    resetearAplicacionCompleta(); 
}

function resetearAplicacionCompleta() {
    currentStep = 1;
    procesoBloqueado = false;
    isBatchMode = false;
    batchList = [];

    localStorage.clear(); 

    const idsToClear = ['rutSearch', 'rutFull', 'nombre', 'actividades', 'batchInputArea', 'fono', 'correo', 'archivoFirmadoSingle'];
    idsToClear.forEach(id => {
        const el = document.getElementById(id);
        if(el) el.value = "";
    });
    
    safeClassAdd('layout-sidebar', 'd-none');
    safeClassAdd('btnSalir', 'd-none');
    
    const main = document.getElementById('layout-main');
    if(main) {
        main.classList.remove('col-lg-9');
        main.classList.add('col-12');
    }

    goToStep(1);
}
function limpiarStorageCompleto() {
    localStorage.removeItem('app_session_user');
    localStorage.removeItem('app_session_locked');
    localStorage.removeItem('app_session_links');
    localStorage.removeItem('app_session_batch_list');
}


// CORRECCIÓN: Aceptar ambos formatos de nombre de propiedad
function configurarPaso3Individual(links) {
    if(!links) return;
    
    const btnRemu = document.getElementById('btnDescargaRemu');
    const btnTransp = document.getElementById('btnDescargaTransp');
    
    // Aquí está el truco: buscar 'remu' O 'urlRemu'
    const linkR = links.remu || links.urlRemu || "#";
    const linkT = links.transp || links.urlTransp || "#";
    
    if(btnRemu) btnRemu.href = linkR;
    if(btnTransp) btnTransp.href = linkT;

    const uiSingle = document.getElementById('upload-ui-single');
    const uiBatch = document.getElementById('upload-ui-batch');
    
    if(uiSingle) uiSingle.classList.remove('d-none');
    if(uiBatch) uiBatch.classList.add('d-none');

    // Navegar
    goToStep(3);
}

function configurarPaso3Lote() {
    const uiSingle = document.getElementById('upload-ui-single');
    const uiBatch = document.getElementById('upload-ui-batch');
    const tbody = document.getElementById('batch-upload-body');
    
    if(uiSingle) uiSingle.classList.add('d-none');
    if(uiBatch) uiBatch.classList.remove('d-none');
    
    if(tbody) {
        tbody.innerHTML = "";
        batchList.forEach((user, index) => {
            if(!user.encontrado) return;
            
            let estadoHtml = '';
            let btnHtml = '';
            
            let linkPdf = (user.links && (user.links.remu || user.links.urlRemu)) ? (user.links.remu || user.links.urlRemu) : "#";

            if (user.uploaded || user.status === "FINALIZADO") {
                estadoHtml = '<span class="badge bg-success">Listo</span>';
                btnHtml = '<button class="btn btn-sm btn-outline-secondary" disabled><i class="bi bi-check-lg"></i> Subido</button>';
            } else if (user.status === "GENERADO") {
                estadoHtml = '<span class="badge bg-warning text-dark">Pendiente Carga</span>';
                btnHtml = `
                    <div class="d-flex gap-1 align-items-center">
                        <a href="${linkPdf}" target="_blank" class="btn btn-sm btn-primary" title="Descargar PDF"><i class="bi bi-download"></i></a>
                        <label class="btn btn-sm btn-success cursor-pointer position-relative mb-0" id="btn-up-${index}">
                            <i class="bi bi-upload"></i> Subir
                            <input type="file" id="file-${index}" class="d-none" accept=".pdf,.jpg,.png" onchange="subirIndividual(${index})">
                        </label>
                        <button class="btn btn-sm btn-outline-danger" onclick="borrarRegistro('${user.rut}', ${index})" title="Eliminar"><i class="bi bi-trash"></i></button>
                    </div>
                `;
            } else if (user.status === "ERROR") {
                estadoHtml = '<span class="badge bg-danger">Error</span>';
                btnHtml = '<small class="text-danger">Ver Log</small>';
            } else {
                estadoHtml = '<span class="badge bg-secondary">En Cola</span>';
            }

            let row = `
                <tr id="row-${item.rut}">
                    <td class="small font-monospace">${user.rut}</td>
                    <td class="small text-truncate" style="max-width: 150px;">${user.nombre}</td>
                    <td class="text-center" id="status-${user.rut}">${estadoHtml}</td>
                    <td class="text-center">${btnHtml}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }
    checkBatchCompletion();
    
    goToStep(3); 
}

function activarModoMasivoAutomatico(lista) {
    isBatchMode = true;
    const badge = document.getElementById('badgeMode');
    if(badge) {
        badge.innerText = "Modo Masivo";
        badge.classList.replace('bg-success-subtle', 'bg-warning-subtle');
        badge.classList.replace('text-success', 'text-warning');
    }
    const divSingle = document.getElementById('mode-single');
    const divBatch = document.getElementById('mode-batch');
    if(divSingle) divSingle.classList.add('d-none');
    if(divBatch) divBatch.classList.remove('d-none');
}
</script>
